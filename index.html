<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>Super secret clock in and out app</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                padding: 20px;
                background-color: black;
                color: white;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
            }
    
            h1 {
                font-size: 20px;
                color: rgb(131, 40, 184);
            }
    
            button {
                padding: 25px 20px;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
                margin: 15px;
                border: none;
                border-radius: 8px;
                width: 90%;
                max-width: 200px;
                height: 65px;
                transition: background 0.3s ease;
                background-color: rgb(226, 159, 1);
                color: black;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
            }
    
            button img {
                width: 100px;
                height: 60px;
                vertical-align: middle;
            }
    
            #status {
                margin-top: 20px;
                font-weight: bold;
                padding: 5px;
                border-radius: 8px;
                width: 90%;
                max-width: 300px;
                font-size: 18px;
                display: flex; /* Use flexbox for centering */
                align-items: center; /* Vertical centering */
                justify-content: center; /* Horizontal centering */
                gap: 5px; /* Space between text and GIF */
            }
    
            #status img {
                width: 45px;
                height: 45px;
                vertical-align: middle;
                margin-left: 5px;
            }
    
            .green-bg { background-color: green; color: white; }
            .red-bg { background-color: red; color: white; }
            .gray-bg { background-color: gray; color: black; }
        </style>
    </head>
    <body>
        <p id="status" class="gray-bg">HIT THE BUTTON <img src="https://media1.tenor.com/m/LoXuYGcyMxgAAAAd/just-do-it-shia-la-beouf.gif"></p>
        <h1>🤫</h1>
        <h1>Super secret clock in and out</h1>
        <button onclick="sendPunch()">
            <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExdWcxeHkydThyeHFicjZpdGJ2a3dkenlqcjhndXVhcmswZnJ1cXIyMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/S5PC0BmFbFnhBjlaTZ/giphy.gif" alt="Boxer Punching">
            Punch
        </button>
    
        <script>
            async function sendPunch() {
                const statusElement = document.getElementById("status");
                
                // Set status to processing on button press
                statusElement.className = "gray-bg";
                statusElement.innerHTML = "⏳...processing...⏳ <img src='https://media1.tenor.com/m/LoXuYGcyMxgAAAAd/just-do-it-shia-la-beouf.gif'>";
    
                try {
                    const response = await fetch("https://ccfx-punch-app.onrender.com/punch", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ employeeId: "0011942154" }) // Pasha's employee key
                    });
    
                    const data = await response.json();
    
                    // Update status based on response
                    if (data.message.includes("in")) {
                        statusElement.className = "green-bg";
                    } else if (data.message.includes("out")) {
                        statusElement.className = "red-bg";
                    } else {
                        statusElement.className = "gray-bg";
                    }
    
                    statusElement.innerHTML = `${data.message || "Punch successful!✅"} <img src="https://media1.tenor.com/m/LoXuYGcyMxgAAAAd/just-do-it-shia-la-beouf.gif">`;
                } catch (error) {
                    console.error("Error punching:", error);
                    statusElement.className = "gray-bg";
                    statusElement.innerHTML = "Error punching in/out. <img src='https://media1.tenor.com/m/LoXuYGcyMxgAAAAd/just-do-it-shia-la-beouf.gif'>";
                }
            }
        </script>
    </body>    
</html>
